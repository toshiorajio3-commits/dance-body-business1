name: Dance Match CI

on:
  pull_request:
    branches:
      - dance-body-business
    paths:
      - "dance-match/**"
      - ".github/workflows/dance-match-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dance-match
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Upload dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: dance-match-package-lock
          path: dance-match/package-lock.json
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
