name: Dance Match CI

on:
  pull_request:
    branches:
      - dance-body-business
    paths:
      - "dance-match/**"
      - ".github/workflows/dance-match-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dance-match
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Commit lockfile if generated
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lock Dance Match dependencies"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
